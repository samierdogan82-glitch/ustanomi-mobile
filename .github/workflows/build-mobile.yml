name: Build Ustanomi Android & iOS

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-android:
    name: Build Android APK & Play Store AAB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Install dependencies & sync Capacitor Android
        run: |
          npm ci || npm install
          npx cap sync android
      - name: Build Debug APK & Release AAB
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease
      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ustanomi-android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
      - name: Upload Google Play AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: ustanomi-android-release-aab
          path: android/app/build/outputs/bundle/release/*.aab

  build-ios:
    name: Build iOS Xcode Archive (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies & sync Capacitor iOS
        run: |
          npm ci || npm install
          npx cap sync ios
      - name: Build Unsigned iOS App Archive
        working-directory: ios/App
        run: |
          pod install
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Upload iOS App artifact
        uses: actions/upload-artifact@v4
        with:
          name: ustanomi-ios-unsigned-app
          path: ios/App/build/Build/Products/Release-iphoneos/App.app
