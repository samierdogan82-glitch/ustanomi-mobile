name: Build Ustanomi Android & iOS

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'store-assets/**'
      - '*.md'

jobs:
  build-android:
    name: Build Android APK & Play Store AAB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Install dependencies & sync Capacitor Android
        run: |
          npm ci || npm install
          npx cap sync android
      - name: Configure Android Release Keystore (when secrets are set)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        shell: bash
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          test -s android/app/upload-keystore.jks
          {
            echo "ANDROID_KEYSTORE_PATH=$GITHUB_WORKSPACE/android/app/upload-keystore.jks"
            echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Build Debug APK & Release AAB
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease
      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ustanomi-android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
      - name: Upload Google Play AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: ustanomi-android-release-aab
          path: android/app/build/outputs/bundle/release/*.aab

  build-ios:
    name: Build iOS Xcode Archive (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies & sync Capacitor iOS
        run: |
          npm ci || npm install
          npx cap sync ios
      - name: Build Unsigned iOS App Archive
        working-directory: ios/App
        run: |
          pod install
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Upload iOS App artifact
        uses: actions/upload-artifact@v4
        with:
          name: ustanomi-ios-unsigned-app
          path: ios/App/build/Build/Products/Release-iphoneos/App.app
