<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <meta name="theme-color" content="#FFFFFF">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <title>Ustanomi</title>
    <style>
        :root {
            --bg: #FFFFFF;
            --fg: #262626;
            --muted: #737373;
            --line: #DBDBDB;
            --soft: #EFEFEF;
            --faint: #FAFAFA;
            --blue: #0095F6;
            --red: #ED4956;
            --ok: #1F9D55;
            --ring: linear-gradient(45deg, #FEDA75, #FA7E1E, #D62976, #962FBF, #4F5BD5);
        }

        *, *::before, *::after {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            width: 100%;
            overflow-x: hidden;
            -webkit-text-size-adjust: 100%;
            background: var(--bg);
        }

        body {
            margin: 0;
            width: 100%;
            min-height: 100dvh;
            overflow-x: clip;
            background: var(--bg);
            color: var(--fg);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-size: 14px;
            line-height: 1.35;
            -webkit-font-smoothing: antialiased;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: calc(50px + env(safe-area-inset-bottom, 0px));
        }

        button { font-family: inherit; color: inherit; cursor: pointer; }
        .app { width: 100%; max-width: 480px; margin: 0 auto; }
        .num { font-variant-numeric: tabular-nums; }

        svg.ico {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex-shrink: 0;
        }

        /* Header */
        .header {
            position: sticky;
            top: 0;
            z-index: 30;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            background: var(--bg);
            border-bottom: 1px solid var(--line);
        }
        .wordmark { margin: 0; display: flex; align-items: center; gap: 8px; font-size: 22px; font-weight: 700; letter-spacing: -0.03em; }
        .wordmark img { width: 28px; height: 28px; display: block; }
        .header-actions { display: flex; gap: 6px; }
        .icon-btn {
            position: relative;
            width: 40px;
            height: 40px;
            display: grid;
            place-items: center;
            background: none;
            border: 0;
            padding: 0;
        }
        .dot {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--red);
            border: 2px solid var(--bg);
        }

        /* Stories */
        .stories {
            display: flex;
            gap: 14px;
            overflow-x: auto;
            padding: 12px 12px 10px;
            scrollbar-width: none;
        }
        .stories::-webkit-scrollbar, .chips::-webkit-scrollbar { display: none; }
        .story { flex: 0 0 68px; width: 68px; text-align: center; background: none; border: 0; padding: 0; }
        .ring { padding: 2px; border-radius: 50%; background: var(--ring); }
        .ring.off { background: var(--line); }
        .ring .in {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid var(--bg);
            background: var(--soft);
            display: grid;
            place-items: center;
            font-weight: 600;
            color: var(--fg);
        }
        .story .ring { width: 66px; height: 66px; margin-bottom: 4px; }
        .story-lbl { display: block; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .chips { display: flex; gap: 8px; overflow-x: auto; padding: 4px 12px 12px; scrollbar-width: none; }
        .chip {
            flex: 0 0 auto;
            height: 32px;
            padding: 0 14px;
            border: 0;
            border-radius: 8px;
            background: var(--soft);
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
        }
        .chip.active { background: var(--fg); color: #fff; }

        /* Views */
        .view { display: none; width: 100%; }
        .view.active { display: block; }

        /* Feed posts */
        .post { border-bottom: 1px solid var(--line); padding-bottom: 12px; }
        .post-head { display: flex; align-items: center; gap: 10px; padding: 8px 12px; }
        .post-head .ring { width: 36px; height: 36px; }
        .post-head .in { font-size: 11px; }
        .who { flex: 1; min-width: 0; }
        .handle { font-weight: 600; display: flex; align-items: center; gap: 4px; }
        .handle span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .sub { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .vf { width: 14px; height: 14px; flex-shrink: 0; }

        .media {
            position: relative;
            aspect-ratio: 1 / 1;
            display: grid;
            place-items: center;
            color: rgba(255, 255, 255, 0.92);
        }
        .media svg { width: 72px; height: 72px; stroke-width: 1.2; }
        .tone-0 { background: #37474F; }
        .tone-1 { background: #5D4037; }
        .tone-2 { background: #455A64; }
        .tone-3 { background: #4E6E58; }
        .tone-4 { background: #6A4C6E; }
        .tone-5 { background: #8A6D3B; }
        .price-tag {
            position: absolute;
            left: 12px;
            bottom: 12px;
            padding: 4px 10px;
            border-radius: 999px;
            background: #fff;
            color: #000;
            font-weight: 600;
        }
        .live-tag {
            position: absolute;
            top: 12px;
            right: 12px;
            padding: 3px 9px;
            border-radius: 999px;
            background: rgba(0, 0, 0, 0.55);
            color: #fff;
            font-size: 12px;
            font-weight: 600;
        }
        .cta-bar {
            width: 100%;
            min-height: 44px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            border: 0;
            background: var(--blue);
            color: #fff;
            font-size: 14px;
            font-weight: 600;
        }
        .cta-bar svg { width: 18px; height: 18px; }
        .actions { display: flex; align-items: center; gap: 4px; padding: 4px 4px 0; }
        .actions .spacer { flex: 1; }
        .actions .icon-btn.liked svg { fill: var(--red); stroke: var(--red); }
        .actions .icon-btn.saved svg { fill: var(--fg); }
        .likes { padding: 0 12px; font-weight: 600; }
        .caption {
            padding: 2px 12px 0;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .note-line { padding: 4px 12px 0; font-size: 12px; color: var(--muted); }

        /* Lists (acil, sanayi) */
        .note { padding: 10px 12px; background: var(--faint); border-bottom: 1px solid var(--line); color: var(--muted); font-size: 13px; }
        .note b { color: var(--fg); font-weight: 600; }
        .item { display: flex; align-items: center; gap: 12px; padding: 12px; border-bottom: 1px solid var(--line); }
        .item .ring { width: 48px; height: 48px; flex-shrink: 0; }
        .item .main { flex: 1; min-width: 0; }
        .title { font-weight: 600; word-break: break-word; }
        .item .sub { white-space: normal; }
        .btn-blue {
            min-height: 32px;
            padding: 0 16px;
            border: 0;
            border-radius: 8px;
            background: var(--blue);
            color: #fff;
            font-weight: 600;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .btn-grey {
            min-height: 32px;
            padding: 0 14px;
            border: 0;
            border-radius: 8px;
            background: var(--soft);
            font-weight: 600;
            white-space: nowrap;
        }
        .btn-block { width: 100%; min-height: 44px; font-size: 14px; border-radius: 8px; }
        .tender { padding: 12px; border-bottom: 1px solid var(--line); }
        .tender .quote { margin: 10px 0; padding: 10px 12px; border-radius: 8px; background: var(--faint); border: 1px solid var(--line); }
        .empty { padding: 32px 12px; text-align: center; color: var(--muted); }
        .empty .btn-grey { margin-top: 10px; }

        /* Profile */
        .p-top { display: flex; align-items: center; gap: 24px; padding: 16px 12px 8px; }
        .p-top .ring { width: 86px; height: 86px; flex-shrink: 0; }
        .p-top .in { font-size: 24px; }
        .stats { flex: 1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); text-align: center; }
        .stats b { display: block; font-size: 16px; font-weight: 700; }
        .stats span { font-size: 13px; }
        .p-bio { padding: 0 12px; }
        .p-bio .name { font-weight: 600; }
        .p-bio .muted { color: var(--muted); }
        .status-row { display: flex; align-items: center; justify-content: space-between; padding: 6px 12px 0; }
        .status-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            height: 28px;
            padding: 0 10px;
            border: 1px solid var(--line);
            border-radius: 999px;
            background: var(--bg);
            font-size: 12px;
            font-weight: 600;
        }
        .status-btn::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
        .status-btn.closed::before { background: var(--red); }
        .p-actions { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1.2fr) minmax(0, 1fr); gap: 6px; padding: 12px; }
        .p-actions button { min-height: 34px; border: 0; border-radius: 8px; font-weight: 600; padding: 0 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .p-actions .primary { background: var(--blue); color: #fff; }
        .p-actions .secondary { background: var(--soft); }
        .highlights { display: flex; gap: 16px; overflow-x: auto; padding: 4px 12px 14px; scrollbar-width: none; }
        .highlights::-webkit-scrollbar { display: none; }
        .hl { flex: 0 0 64px; text-align: center; font-size: 12px; }
        .hl .circle {
            width: 60px;
            height: 60px;
            margin: 0 auto 4px;
            border-radius: 50%;
            border: 1px solid var(--line);
            background: var(--faint);
            display: grid;
            place-items: center;
            font-weight: 600;
        }
        .hl span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .tabs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid var(--line); }
        .tabs button {
            height: 44px;
            display: grid;
            place-items: center;
            background: none;
            border: 0;
            border-top: 1px solid transparent;
            margin-top: -1px;
            color: var(--muted);
        }
        .tabs button.active { color: var(--fg); border-top-color: var(--fg); }
        .grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2px; }
        .tile { position: relative; aspect-ratio: 1 / 1; padding: 8px; display: flex; flex-direction: column; justify-content: flex-end; color: #fff; overflow: hidden; }
        .tile .cap { font-size: 12px; font-weight: 600; line-height: 1.2; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .tile .pr { font-size: 11px; opacity: 0.9; }
        .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px; border-bottom: 1px solid var(--line); }
        .row .main { min-width: 0; }
        .row .amt { font-weight: 600; white-space: nowrap; }
        .stat2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-bottom: 1px solid var(--line); }
        .stat2 div { padding: 12px; }
        .stat2 div + div { border-left: 1px solid var(--line); }
        .stat2 b { display: block; font-size: 18px; margin-top: 2px; }
        .stat2 span { color: var(--muted); font-size: 12px; }
        .pad { padding: 12px; }

        /* Chat */
        .chat-head { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
        .chat-head .ring { width: 40px; height: 40px; }
        .thread { display: flex; flex-direction: column; gap: 8px; padding: 12px; }
        .bubble { max-width: 78%; padding: 8px 12px; border-radius: 18px; word-break: break-word; }
        .bubble.sent { align-self: flex-end; background: #3797F0; color: #fff; }
        .bubble.recv { align-self: flex-start; background: var(--soft); }
        .offer { align-self: flex-start; width: 86%; border: 1px solid var(--line); border-radius: 16px; padding: 12px; }
        .offer .amt { font-size: 20px; font-weight: 700; margin: 2px 0 10px; }
        .chat-input { display: flex; gap: 8px; padding: 8px 12px; border-top: 1px solid var(--line); }
        .link-btn { background: none; border: 0; color: var(--blue); font-weight: 600; padding: 0 6px; }

        /* Forms */
        .input {
            width: 100%;
            min-width: 0;
            min-height: 44px;
            padding: 10px 12px;
            margin-bottom: 8px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--faint);
            color: var(--fg);
            font-family: inherit;
            font-size: 16px;
        }
        .input:focus { outline: none; border-color: #A8A8A8; }
        .chat-input .input { margin: 0; border-radius: 22px; }
        .form { padding: 16px 12px; }
        .seg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-bottom: 1px solid var(--line); margin-bottom: 14px; }
        .seg button { height: 40px; background: none; border: 0; border-bottom: 1px solid transparent; margin-bottom: -1px; color: var(--muted); font-weight: 600; }
        .seg button.active { color: var(--fg); border-bottom-color: var(--fg); }
        .help { font-size: 12px; color: var(--muted); margin: -2px 0 8px; }
        .feedback { margin-top: 10px; font-size: 13px; font-weight: 600; word-break: break-word; }
        .danger { background: none; border: 0; color: var(--red); font-weight: 600; padding: 12px 0 0; }
        .checks { display: flex; flex-wrap: wrap; gap: 14px; margin: 4px 0 14px; color: var(--muted); }
        .two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
        .two .input { margin: 0; }
        .two { margin-bottom: 8px; }
        .field-lbl { font-size: 12px; color: var(--muted); margin: 4px 0 4px; display: block; }

        /* Sheets */
        .backdrop { position: fixed; inset: 0; z-index: 60; display: none; align-items: flex-end; justify-content: center; background: rgba(0, 0, 0, 0.65); }
        .backdrop.open { display: flex; }
        .sheet {
            width: 100%;
            max-width: 480px;
            max-height: 88dvh;
            overflow-y: auto;
            background: var(--bg);
            border-radius: 12px 12px 0 0;
            padding: 8px 12px calc(16px + env(safe-area-inset-bottom, 0px));
        }
        .handle-bar { width: 36px; height: 4px; margin: 0 auto 10px; border-radius: 99px; background: var(--line); }
        .sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
        .sheet-head strong { font-size: 16px; }
        canvas.sig { width: 100%; height: 150px; display: block; touch-action: none; background: var(--faint); border: 1px dashed #A8A8A8; border-radius: 8px; margin-bottom: 10px; }

        /* Story viewer */
        .story-view { background: #000; color: #fff; align-items: stretch; }
        .story-card { width: 100%; max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; padding: calc(12px + env(safe-area-inset-top, 0px)) 12px calc(16px + env(safe-area-inset-bottom, 0px)); }
        .bar { height: 2px; background: rgba(255, 255, 255, 0.35); border-radius: 2px; overflow: hidden; margin-bottom: 12px; }
        .bar i { display: block; width: 72%; height: 100%; background: #fff; }
        .story-top { display: flex; align-items: center; gap: 10px; }
        .story-top .ring { width: 40px; height: 40px; }
        .story-top .in { background: #262626; color: #fff; border-color: #000; font-size: 12px; }
        .story-top .grow { flex: 1; min-width: 0; }
        .story-top .icon-btn { color: #fff; }
        .story-body { flex: 1; display: flex; flex-direction: column; justify-content: center; text-align: center; padding: 0 12px; }
        .story-title { font-size: 24px; font-weight: 700; line-height: 1.25; margin: 10px 0; }
        .story-reply {
            min-height: 44px;
            border: 1px solid rgba(255, 255, 255, 0.7);
            border-radius: 999px;
            background: transparent;
            color: #fff;
            font-weight: 600;
        }

        /* Toast */
        #toast-stack { position: fixed; top: calc(56px + env(safe-area-inset-top, 0px)); left: 0; right: 0; z-index: 90; display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; padding: 0 12px; }
        .toast { background: #262626; color: #fff; padding: 10px 16px; border-radius: 999px; font-weight: 600; font-size: 13px; max-width: 100%; text-align: center; }

        /* Bottom navigation: icons only */
        .nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: var(--bg); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
        .nav-inner { max-width: 480px; margin: 0 auto; height: 50px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); }
        .nav button { display: grid; place-items: center; background: none; border: 0; color: var(--fg); }
        .nav .nav-inner button.active svg { stroke-width: 2.6; }
    </style>
</head>
<body>
    <div class="app">
        <header class="header">
            <h1 class="wordmark"><img src="favicon.svg" alt="" width="28" height="28">Ustanomi</h1>
            <div class="header-actions">
                <button type="button" class="icon-btn" id="open-filter-sheet-btn" aria-label="Filtre">
                    <svg class="ico" aria-hidden="true" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
                </button>
                <button type="button" class="icon-btn" id="open-dm-view-btn" aria-label="Mesajlar">
                    <svg class="ico" aria-hidden="true" viewBox="0 0 24 24"><path d="M22 3 2 10.5l7.5 3L12.5 21z"/><path d="M22 3 9.5 13.5"/></svg>
                    <span class="dot"></span>
                </button>
            </div>
        </header>

        <div id="discover-header-strip">
            <section class="stories" id="stories-bar" aria-label="Hikâyeler"></section>
            <nav class="chips" id="cluster-bar" aria-label="Kategoriler"></nav>
        </div>

        <main id="tab-reels" class="view active"><div id="reels-feed-list"></div></main>

        <section id="tab-urgent" class="view">
            <div class="note"><b id="smart-quote-badge">Tahmini aralık</b><br><span id="smart-quote-milestones" class="num"></span></div>
            <div id="urgent-feed-list"></div>
        </section>

        <section id="tab-b2b" class="view"><div id="b2b-tenders-list"></div></section>

        <section id="tab-profile" class="view">
            <div class="status-row">
                <span></span>
                <button type="button" class="status-btn" id="pro-mode-toggle">Açık</button>
            </div>
            <div id="ig-profile-container"></div>
        </section>

        <section id="tab-auth" class="view">
            <div class="form">
                <div class="seg">
                    <button type="button" class="auth-tab-btn active" data-auth-mode="kyc-register">Kayıt</button>
                    <button type="button" class="auth-tab-btn" data-auth-mode="login">Giriş</button>
                    <button type="button" class="auth-tab-btn" data-auth-mode="forgot">Şifre</button>
                </div>

                <div id="auth-pane-kyc-register">
                    <select id="kyc-role-select" class="input" aria-label="Hesap türü">
                        <option value="MASTER">Usta / Sanayici</option>
                        <option value="CUSTOMER">Müşteri</option>
                    </select>
                    <input type="text" id="kyc-fullname" class="input" placeholder="Ad soyad" aria-label="Ad soyad">
                    <input type="text" id="kyc-tckn" class="input" maxlength="11" inputmode="numeric" placeholder="T.C. kimlik no" aria-label="T.C. kimlik no">
                    <div id="kyc-tckn-hint" class="help"></div>
                    <input type="text" id="kyc-iban" class="input" maxlength="32" placeholder="TR IBAN" aria-label="IBAN">
                    <input type="email" id="kyc-email" class="input" placeholder="E-posta" aria-label="E-posta">
                    <input type="password" id="kyc-password" class="input" placeholder="Şifre" aria-label="Şifre">
                    <div id="kyc-pwd-label" class="help"></div>
                    <input type="checkbox" id="kyc-kvkk-check" checked hidden>
                    <input type="checkbox" id="kyc-escrow-check" checked hidden>
                    <input type="text" id="kyc-honeypot" name="_hp_website" value="" tabindex="-1" autocomplete="off" hidden>
                    <button type="button" class="btn-blue btn-block" id="kyc-submit-btn">Hesap aç</button>
                </div>

                <div id="auth-pane-login" style="display:none;">
                    <input type="email" id="login-email" class="input" placeholder="E-posta" aria-label="E-posta">
                    <input type="password" id="login-password" class="input" placeholder="Şifre" aria-label="Şifre">
                    <button type="button" class="btn-blue btn-block" id="login-submit-btn">Giriş yap</button>
                </div>

                <div id="auth-pane-forgot" style="display:none;">
                    <div class="chat-input" style="padding:0 0 8px;border:0;">
                        <input type="email" id="forgot-email" class="input" placeholder="E-posta" aria-label="E-posta">
                        <button type="button" class="link-btn" id="forgot-send-otp-btn">Kod gönder</button>
                    </div>
                    <input type="text" id="forgot-otp-code" class="input" maxlength="6" placeholder="Doğrulama kodu" aria-label="Doğrulama kodu">
                    <input type="password" id="forgot-new-password" class="input" placeholder="Yeni şifre" aria-label="Yeni şifre">
                    <button type="button" class="btn-blue btn-block" id="forgot-reset-btn">Şifreyi yenile</button>
                </div>

                <div id="auth-feedback-box" class="feedback" aria-live="polite"></div>
                <button type="button" class="danger" id="kvkk-delete-account-btn">Hesabımı sil</button>
            </div>
        </section>

        <section id="tab-dm" class="view">
            <div class="chat-head">
                <div class="ring"><div class="in" style="font-size:13px;">MB</div></div>
                <div class="who">

        const b2bTenders = [

                    renderReels();
                });
                el.querySelector('.save-btn').addEventListener('click', () => {
                    if (savedPosts.has(item.id)) {
                        savedPosts.delete(item.id);
                    } else {
                        savedPosts.add(item.id);
                        showToast('Kaydedildi');
                    }
                    renderReels();
                });
                el.querySelector('.dm-btn').addEventListener('click', () => $('open-dm-view-btn')?.click());
                el.querySelector('.hire-main-btn').addEventListener('click', async () => {
                    const req = createWorkWithYouRequestPayload({
                        talentPostId: item.id,
                        proHandle: item.handle,
                        skillTitle: item.title,
                        offeredBudgetTl: item.priceTl,
                        customerNote: 'Sizinle çalışmak istiyorum.'
                    });
                    item.workRequestsCount += 1;
                    item.lastHireFeedback = `Talep iletildi · ${req.requestCode}`;
                    triggerHapticImpact('MEDIUM');
                    showToast('Talep iletildi');
                    await enqueueOfflineAction('DIRECT_WORK_WITH_YOU_REQUEST', req);
                    renderReels();
                });
                reelsFeedList.appendChild(el);
            }
        }

        function renderUrgentFeed() {
            urgentFeedList.innerHTML = '';
            const activeCluster = UNIVERSAL_PROFESSION_CLUSTERS.find((c) => c.code === activeClusterCode);
            const quote = estimateArmutStyleSmartQuote({
                professionQuery: activeCluster ? activeCluster.titleTr : 'tesisat',
                scopeSize: 'SMALL',
                urgencyCode: 'EMERGENCY_30M',
                regionCode: activeRegionCode
            });
            const ms = calculateSplitPaymentEscrow(quote.recommendedPriceTl).milestonesTl;
            $('smart-quote-badge').textContent = `Tahmini ${plain(quote.formattedRange)}`;
            $('smart-quote-milestones').textContent = `Ödeme 3 etapta: ${money(ms[0])} · ${money(ms[1])} · ${money(ms[2])}`;

            const filtered = filterAndSearchMarketplace(urgentPosts, getActiveSearchFilters());
            if (filtered.length === 0) {
                urgentFeedList.innerHTML = '<div class="empty">Acil iş yok.<br><button type="button" class="btn-grey" id="reset-urgent-filter-btn">Sıfırla</button></div>';
                $('reset-urgent-filter-btn')?.addEventListener('click', () => {
                    activeClusterCode = 'ALL';
                    renderClusters();
                    renderReels();
                    renderUrgentFeed();
                });
                return;
            }
            for (const post of filtered) {
                const row = document.createElement('article');
                row.className = 'item';
                row.innerHTML = `
                    <div class="ring"><div class="in">${esc(initials(post.district))}</div></div>
                    <div class="main">
                        <div class="title">${esc(post.title)}</div>
                        <div class="sub">${esc(post.district)} · ${esc(plain(post.urgencyBadgeTr))} · <span class="num">~${esc(money(post.estimatedBudgetTl))}</span> · ${post.offersCount} teklif</div>
                    </div>
                    <button type="button" class="btn-blue urgent-bid-btn">Teklif ver</button>
                `;
                row.querySelector('.urgent-bid-btn').addEventListener('click', () => {
                    post.offersCount += 1;
                    triggerHapticImpact('LIGHT');
                    showToast('Teklifin iletildi');
                    renderUrgentFeed();
                });
                urgentFeedList.appendChild(row);
            }
        }

        function renderB2bTenders() {
            b2bListEl.innerHTML = '';
            for (const t of b2bTenders) {
                const p = t.sealedProformas[0];
                const card = document.createElement('article');
                card.className = 'tender';
                card.innerHTML = `
                    <div class="title">${esc(t.title)}</div>
                    <div class="sub" style="white-space:normal;">${esc(t.city)} · ${esc(t.spec)}</div>
                    <div class="quote">
                        <div style="font-weight:600;">${esc(p.supplierCompanyTitle)}</div>
                        <div class="sub" style="white-space:normal;">${esc(p.partsDescription)} · ${p.warrantyMonths} ay garanti</div>
                        <div class="num" style="font-weight:700;margin-top:4px;">${esc(money(p.financials.grandTotalTl))} <span style="font-weight:400;color:var(--muted);">KDV dahil</span></div>
                    </div>
                    <button type="button" class="btn-blue btn-block b2b-send-prf-btn">Teklif ver</button>
                `;
                card.querySelector('.b2b-send-prf-btn').addEventListener('click', (e) => {
                    triggerHapticImpact('MEDIUM');
                    e.currentTarget.textContent = 'Teklif iletildi';
                    e.currentTarget.disabled = true;
                });
                b2bListEl.appendChild(card);
            }
        }

        const walletJobs = [
            { id: 'JOB-801', title: 'BMW F30 triger ve fren seti', amountTl: 19000, state: 'SHIPPED_WAYBILL', waybillCode: 'YK-90887766' },
            { id: 'JOB-802', title: 'Kadıköy su kaçağı ve kombi bakımı', amountTl: 2250, state: 'RELEASED_TO_IBAN', waybillCode: null },
            { id: 'JOB-803', title: 'Beşiktaş kafe drone çekimi', amountTl: 3200, state: 'RELEASED_TO_IBAN', waybillCode: null }
        ];

        function renderWalletSubTabHtml() {
            const summary = calculateProWalletDashboard(walletJobs);
            const rows = summary.jobs.map((j) => {
                const done = j.state === 'RELEASED_TO_IBAN';
                return `<div class="row"><div class="main"><div class="title">${esc(j.title)}</div><div class="sub">${done ? 'Hesaba aktarıldı' : `Kargo ${esc(j.waybillCode)} · teslimde açılır`}</div></div><span class="amt num">${esc(money(j.proNetShareTl))}</span></div>`;
            }).join('');
            return `
                <div class="stat2">
                    <div><span>Hesaba geçen</span><b class="num">${esc(money(summary.releasedToIbanNetTl))}</b></div>
                    <div><span>Havuzda</span><b class="num">${esc(money(summary.heldInPoolNetTl))}</b></div>
                </div>
                ${rows}
                <div class="pad"><button type="button" class="btn-blue btn-block" id="open-signature-sheet-btn">Teslimi imzayla onayla</button></div>
            `;
        }

        let dmEscrowLocked = false;
        const dmMessages = [
            { sender: 'CUSTOMER', text: '2021 BMW 320i triger ve ön fren için fiyatınız nedir?' },
            {
                sender: 'PRO',
                proforma: createDmProformaMessageCard({
                    senderHandle: 'maslak_bimmer_servis',
                    recipientHandle: 'musteri_kadikoy',
                    serviceOrPartTitle: 'Orijinal triger seti, fren ve işçilik',
                    partsAmountTl: 14500,
                    laborAmountTl: 4500,
                    etaOrDeliveryLabel: 'Bugün teslim',
                    warrantyMonths: 12,
                    isAcceptedInEscrow: false
                })
            }
        ];

        function renderDmThread() {
            const listEl = $('dm-thread-list');
            listEl.innerHTML = '';
            for (const m of dmMessages) {
                if (m.proforma) {
                    const p = m.proforma;
                    const card = document.createElement('div');
                    card.className = 'offer';
                    card.innerHTML = `
                        <div class="sub">Teklif · ${p.warrantyMonths} ay garanti</div>
                        <div class="title">${esc(p.serviceOrPartTitle)}</div>
                        <div class="amt num">${esc(money(p.totalAmountTl))}</div>
                        <button type="button" class="${dmEscrowLocked ? 'btn-grey' : 'btn-blue'} btn-block dm-approve-escrow-btn" ${dmEscrowLocked ? 'disabled' : ''}>${dmEscrowLocked ? 'Havuzda onaylandı' : 'Güvenli havuzda onayla'}</button>
                    `;
                    card.querySelector('.dm-approve-escrow-btn').addEventListener('click', () => {
                        dmEscrowLocked = true;
                        triggerHapticImpact('MEDIUM');
                        showToast('Tutar havuza alındı');
                        renderDmThread();
                    });
                    listEl.appendChild(card);
                } else {
                    const bubble = document.createElement('div');
                    bubble.className = `bubble ${m.sender === 'CUSTOMER' ? 'sent' : 'recv'}`;
                    bubble.textContent = m.text;
                    listEl.appendChild(bubble);
                }
            }
        }

        $('open-dm-view-btn')?.addEventListener('click', () => {
            showView('tab-dm');
            renderDmThread();
        });
        $('dm-send-btn')?.addEventListener('click', () => {
            const input = $('dm-msg-input');
            if (!input?.value?.trim()) return;
            const checked = sanitizeInAppChatMessage(input.value, dmEscrowLocked);
            dmMessages.push({ sender: 'CUSTOMER', text: checked.blockedLeakAttempt ? `${checked.cleanMessage} (${plain(checked.warningTr)})` : checked.cleanMessage });
            input.value = '';
            renderDmThread();
        });

        function renderInstagramProfile() {
            const baseProfile = customSyncedShowcase || {
                handle: 'selim_ustanomi',
                displayName: 'Selim Karaca',
                professionTitle: 'Tesisat, kombi ve akıllı ev uzmanı',
                clusterId: 'home_technical',
                city: 'İstanbul',
                district: 'Kadıköy',
                rating: 4.9,
                completedJobsCount: 342,
                followersCount: 2890,
                responseTimeMinutes: 3,
                priceMenu: [
                    { title: 'Termal kameralı su kaçağı tespiti', priceTl: 850, pricingType: 'FIXED', durationLabel: '45 dk' },
                    { title: 'Kombi ve petek kimyasal bakım', priceTl: 1400, pricingType: 'FIXED', durationLabel: '90 dk' },
                    { title: 'Saatlik usta işçiliği', priceTl: 650, pricingType: 'HOURLY', durationLabel: '60 dk' }
                ],
                mediaGrid: [
                    { id: 'm1', mediaType: 'REEL_VIDEO', caption: 'Termal tespit', priceTagTl: 850 },
                    { id: 'm2', mediaType: 'BEFORE_AFTER_PHOTO', caption: 'Banyo yenileme', priceTagTl: 14500 },
                    { id: 'm3', mediaType: 'REEL_VIDEO', caption: 'Akıllı termostat', priceTagTl: 950 },
                    { id: 'm4', mediaType: 'BEFORE_AFTER_PHOTO', caption: 'Kombi kolektör', priceTagTl: 3200 },
                    { id: 'm5', mediaType: 'REEL_VIDEO', caption: 'Acil vana', priceTagTl: 1100 },
                    { id: 'm6', mediaType: 'BEFORE_AFTER_PHOTO', caption: 'MYK belgelerim', priceTagTl: 0 }
                ]
            };
            const profile = formatInstagramProShowcase({
                ...baseProfile,
                availabilityConfig: { manualMode: availabilityCycle[currentModeIndex], openHour: 8, closeHour: 20, currentHour: 14 }
            });

            const status = profile.availability.status;
            proModeToggle.textContent = status === 'OPEN' ? 'Açık' : status === 'ON_DUTY_24_7' ? '7/24' : 'Kapalı';
            proModeToggle.classList.toggle('closed', status === 'CLOSED');

            const highlightsHtml = profile.storyHighlights.map((h) => `<div class="hl"><div class="circle">${esc(initials(h.title))}</div><span>${esc(plain(h.title))}</span></div>`).join('');
            const gridHtml = profile.mediaGrid.map((m, i) => `
                <div class="tile tone-${i % 6}">
                    <div class="cap">${esc(plain(m.caption))}</div>
                    <div class="pr num">${m.priceTagTl > 0 ? esc(money(m.priceTagTl)) : 'Belge'}</div>
                </div>`).join('');
            const pricesHtml = profile.priceMenu.map((pm) => `
                <div class="row"><div class="main"><div class="title">${esc(pm.title)}</div><div class="sub">${esc(pm.durationLabel)}</div></div><span class="amt num">${esc(money(pm.effectivePriceTl))}</span></div>`).join('');

            const body = activeProfileSubTab === 'GRID' ? `<div class="grid3">${gridHtml}</div>` : activeProfileSubTab === 'PRICES' ? pricesHtml : renderWalletSubTabHtml();
            const tab = (key, icon, label) => `<button type="button" class="${activeProfileSubTab === key ? 'active' : ''}" data-subtab="${key}" aria-label="${label}">${svg(icon)}</button>`;

            igProfileContainer.innerHTML = `
                <div class="p-top">
                    <div class="ring ${status === 'CLOSED' ? 'off' : ''}"><div class="in">${esc(initials(profile.displayName))}</div></div>
                    <div class="stats">
                        <div><b class="num">${profile.metrics.completedJobsCount}</b><span>İş</span></div>
                        <div><b class="num">${Number(profile.metrics.followersCount).toLocaleString('tr-TR')}</b><span>Takipçi</span></div>
                        <div><b class="num">${profile.metrics.rating}</b><span>Puan</span></div>
                    </div>
                </div>
                <div class="p-bio">
                    <div class="name" style="display:flex;align-items:center;gap:4px;">${esc(profile.displayName)}${verified}</div>
                    <div class="muted">${esc(profile.professionTitle)}</div>
                    <div class="muted">${esc(plain(profile.locationLabel))}</div>
                </div>
                <div class="p-actions">
                    <button type="button" class="primary" id="ig-hire-btn">Çalışalım</button>
                    <button type="button" class="secondary" id="ig-connect-store-btn">Mağaza bağla</button>
                    <button type="button" class="secondary" id="ig-kyc-btn">Doğrula</button>
                </div>
                <div class="highlights">${highlightsHtml}</div>
                <div class="tabs">${tab('GRID', 'grid', 'Vitrin')}${tab('PRICES', 'tag', 'Fiyatlar')}${tab('WALLET', 'wallet', 'Cüzdan')}</div>
                ${body}
            `;

            igProfileContainer.querySelectorAll('.tabs button').forEach((btn) => {
                btn.addEventListener('click', () => {
                    activeProfileSubTab = btn.dataset.subtab;
                    renderInstagramProfile();
                });
            });
            $('ig-hire-btn')?.addEventListener('click', (e) => {
                triggerHapticImpact('MEDIUM');
                e.currentTarget.textContent = 'İstek gönderildi';
            });
            $('ig-connect-store-btn')?.addEventListener('click', () => $('create-sheet').classList.add('open'));
            $('ig-kyc-btn')?.addEventListener('click', () => showView('tab-auth'));
            $('open-signature-sheet-btn')?.addEventListener('click', () => $('signature-sheet')?.classList.add('open'));
        }

        // Signature
        const signatureSheet = $('signature-sheet');
        const sigCanvas = $('wet-signature-canvas');
        const sigFeedback = $('signature-proof-feedback');
        const sigPad = sigCanvas ? createSignaturePad(sigCanvas) : null;
        $('close-signature-sheet-btn')?.addEventListener('click', () => signatureSheet.classList.remove('open'));
        $('clear-signature-btn')?.addEventListener('click', () => {
            sigPad?.clear();
            sigFeedback.textContent = '';
        });
        $('confirm-signature-btn')?.addEventListener('click', async () => {
            const proof = sigPad && !sigPad.isEmpty()
                ? sigPad.getProof('JOB-801', 'Selim Karaca teslim onayı')
                : createTouchWetSignatureProof({ jobId: 'JOB-801', signerName: 'Selim Karaca teslim onayı', strokePointsCount: 28, boundingBoxWidth: 180, boundingBoxHeight: 64 });
            sigFeedback.style.color = proof.valid ? 'var(--ok)' : 'var(--red)';
            sigFeedback.textContent = plain(proof.messageTr);
            if (proof.valid) {
                walletJobs[0].state = 'RELEASED_TO_IBAN';
                triggerHapticImpact('MEDIUM');
                showToast('Teslim onaylandı');
                await enqueueOfflineAction('WET_SIGNATURE_ESCROW_RELEASE', proof);
                renderInstagramProfile();
            }
        });

        // Sheets
        const filterSheet = $('filter-sheet');
        const createSheet = $('create-sheet');
        $('open-filter-sheet-btn').addEventListener('click', () => filterSheet.classList.add('open'));
        $('close-filter-sheet-btn').addEventListener('click', () => filterSheet.classList.remove('open'));
        $('apply-filters-btn').addEventListener('click', () => {
            filterSheet.classList.remove('open');
            renderReels();
            renderUrgentFeed();
        });
        $('open-create-sheet-btn').addEventListener('click', () => createSheet.classList.add('open'));
        $('close-create-sheet-btn').addEventListener('click', () => createSheet.classList.remove('open'));
        document.querySelectorAll('.backdrop:not(.story-view)').forEach((b) => {
            b.addEventListener('click', (e) => {
                if (e.target === b) b.classList.remove('open');
            });
        });

        proModeToggle.addEventListener('click', () => {
            currentModeIndex = (currentModeIndex + 1) % availabilityCycle.length;
            triggerHapticImpact('LIGHT');
            renderInstagramProfile();
        });

        $('global-region-select').addEventListener('change', (e) => {
            activeRegionCode = e.target.value;
            renderReels();
            renderUrgentFeed();
            renderB2bTenders();
            renderInstagramProfile();
        });

        $('share-talent-btn').addEventListener('click', () => {
            const titleEl = $('talent-title-input');
            const priceEl = $('talent-price-input');
            if (!titleEl.value || titleEl.value.trim().length < 4) return;
            const cluster = resolveUniversalProfessionCluster(titleEl.value);
            reelsItems.unshift({
                id: `TALENT-${Date.now()}`,
                handle: '@ustanomi_uzman',
                clusterCode: cluster.code,
                cluster: plain(cluster.titleTr.split(',')[0]),
                city: '',
                tone: reelsItems.length % 6,
                title: titleEl.value.trim(),
                priceTl: Math.max(100, Number(priceEl.value) || cluster.startingPriceTl),
                availability: 'Açık',
                isProOpen: true,
                likesCount: 0,
                workRequestsCount: 0,
                lastHireFeedback: ''
            });
            titleEl.value = '';
            priceEl.value = '';
            createSheet.classList.remove('open');
            showToast('Paylaşıldı');
            renderReels();
        });

        // Store import
        const extUrlInput = $('ext-sync-url-input');
        const extFeedback = $('ext-sync-feedback');
        let presetTitleHint = '';
        document.querySelectorAll('.quick-import-preset').forEach((btn) => {
            btn.addEventListener('click', () => {
                extUrlInput.value = btn.dataset.url || '';
                presetTitleHint = btn.dataset.title || '';
                $('ext-sync-pull-btn').click();
            });
        });
        $('ext-sync-pull-btn').addEventListener('click', () => {
            try {
                const imported = parseAndImportExternalCommerceProfile({ sourceUrl: (extUrlInput.value || '').trim(), rawTitle: presetTitleHint || undefined });
                presetTitleHint = '';
                customSyncedShowcase = imported.showcaseProfile;
                const links = buildOmnichannelEngagementLinks({ proHandle: imported.showcaseProfile.handle, title: imported.showcaseProfile.displayName });
                extFeedback.style.color = 'var(--ok)';
                extFeedback.textContent = `${plain(imported.connectorNameTr)} bağlandı (${links.proHandle})`;
                renderInstagramProfile();
            } catch {
                extFeedback.style.color = 'var(--red)';
                extFeedback.textContent = 'Geçerli bir bağlantı gir.';
            }
        });

        // Auth
        const authFeedback = $('auth-feedback-box');
        document.querySelectorAll('.auth-tab-btn').forEach((btn) => {
            btn.addEventListener('click', () => {
                const mode = btn.dataset.authMode;
                document.querySelectorAll('.auth-tab-btn').forEach((b) => {
                    b.classList.toggle('active', b === btn);
                });
                $('auth-pane-kyc-register').style.display = mode === 'kyc-register' ? 'block' : 'none';
                $('auth-pane-login').style.display = mode === 'login' ? 'block' : 'none';
                $('auth-pane-forgot').style.display = mode === 'forgot' ? 'block' : 'none';
                authFeedback.textContent = '';
            });
        });
        const tcknInput = $('kyc-tckn');
        const tcknHint = $('kyc-tckn-hint');
        tcknInput.addEventListener('input', () => {
            const val = tcknInput.value.replace(/\D/g, '');
            tcknInput.value = val;
            if (val.length === 11) {
                const ok = validateTurkishTckn(val);
                tcknHint.style.color = ok ? 'var(--ok)' : 'var(--red)';
                tcknHint.textContent = ok ? 'Kimlik doğrulandı' : 'Geçersiz kimlik numarası';
            } else {
                tcknHint.textContent = '';
            }
        });
        const pwdInput = $('kyc-password');
        const pwdLabel = $('kyc-pwd-label');
        pwdInput.addEventListener('input', () => {
            const res = evaluatePasswordStrength(pwdInput.value);
            pwdLabel.style.color = res.isStrong ? 'var(--ok)' : 'var(--muted)';
            pwdLabel.textContent = pwdInput.value ? plain(res.labelTr) : '';
        });
        $('kyc-submit-btn').addEventListener('click', () => {
            const waf = evaluateWafRateLimitAndHoneypot({ honeypotValue: $('kyc-honeypot')?.value || '' });
            if (!waf.allowed) {
                authFeedback.style.color = 'var(--red)';
                authFeedback.textContent = 'İstek engellendi.';
                return;
            }
            const result = validateKycRegistrationPayload({
                fullName: $('kyc-fullname').value,
                tckn: tcknInput.value,
                iban: $('kyc-iban').value,
                email: $('kyc-email').value,
                password: pwdInput.value,
                accountRole: $('kyc-role-select').value,
                kvkkAccepted: true,
                escrowContractAccepted: true
            });
            authFeedback.style.color = result.valid ? 'var(--ok)' : 'var(--red)';
            authFeedback.textContent = result.valid ? `${plain(result.kycBadgeTr)} (${result.maskedTckn})` : plain(result.messageTr);
        });
        $('kvkk-delete-account-btn')?.addEventListener('click', () => {
            const check = evaluateAccountDeletionEligibility({ userId: 101, activeEscrowStatuses: dmEscrowLocked ? ['WORK_IN_PROGRESS'] : ['CUSTOMER_APPROVED_RELEASED'] });
            const efatura = generateGibEfaturaQrSummary({ proformaRefCode: 'PRF-2026', subtotalTl: 1000 });
            const waybill = verifyWaybillAndEscrowRelease({ carrierCode: 'YURTICI', trackingNumber: 'YK-90887766', buyerDeliveryConfirmed: true, hasSignatureOrOtp: true });
            const arb = resolveEscrowDisputeCase({ totalEscrowAmountTl: 1000, hasCustomerWetSignatureOrOtp: true });
            authFeedback.style.color = check.canDeleteAccount ? 'var(--ok)' : 'var(--muted)';
            authFeedback.textContent = `${plain(check.messageTr)} (${waybill.carrierCode} · ${efatura.customizationId} · ${arb.resolutionDecision})`;
        });

        document.querySelectorAll('.tab-btn[data-target]').forEach((btn) => {
            btn.addEventListener('click', () => showView(btn.dataset.target));
        });

        initUstanomiNativeShell({
            onNetworkChange(status) {
                if (!status.connected) window.location.replace('offline.html');
            }
        });
        if ('serviceWorker' in navigator && window.location.protocol === 'https:') {
            navigator.serviceWorker.register('sw.js').catch(() => {});
        }

        renderStories();
        renderClusters();
        renderReels();
        renderUrgentFeed();
        renderB2bTenders();
        renderInstagramProfile();

        // Deep links for visual verification
        const params = new URLSearchParams(window.location.search);
        if (params.get('tab')) showView(params.get('tab'));
        if (params.get('prices') === '1') { activeProfileSubTab = 'PRICES'; renderInstagramProfile(); }
        if (params.get('wallet') === '1') { activeProfileSubTab = 'WALLET'; renderInstagramProfile(); }
        if (params.get('story') === '1') openStoryViewer(storyDeck[0]);
        if (params.get('dm') === '1') $('open-dm-view-btn')?.click();
        if (params.get('sheet') === 'filter') filterSheet.classList.add('open');
        if (params.get('sheet') === 'create') createSheet.classList.add('open');
        if (params.get('sheet') === 'signature') signatureSheet.classList.add('open');

        evaluateMobileViewportErgonomics({
            viewportWidthPx: window.innerWidth,
            documentScrollWidthPx: document.documentElement.scrollWidth,
            minTapTargetPx: 44,
            inputFontSizePx: 16,
            hasSafeAreaInsets: true
        });
    </script>
</body>
</html>
