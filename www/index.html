<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#153E49">
    <link rel="manifest" href="manifest.json">
    <title>Ustanomi</title>
    <style>
        body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:#153E49; color:#FAF9F6; font-family:system-ui,-apple-system,sans-serif; padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); box-sizing:border-box; }
        .loader { text-align:center; padding:24px; max-width:340px; }
        .crest { width:72px; height:72px; margin:0 auto 18px; border-radius:22px; background:rgba(255,255,255,0.08); display:flex; align-items:center; justify-content:center; border:1px solid rgba(245,158,11,0.5); box-shadow:0 12px 28px rgba(0,0,0,0.22); }
        h1 { margin:0 0 8px; font-size:1.38rem; letter-spacing:2px; font-weight:800; }
        p { margin:0 0 16px; font-size:0.88rem; color:#CBD5E1; line-height:1.45; }
        .pill { display:inline-flex; align-items:center; gap:6px; font-size:0.75rem; padding:6px 12px; border-radius:999px; background:rgba(245,158,11,0.16); color:#FDE68A; border:1px solid rgba(245,158,11,0.35); font-weight:600; }
        .dot { width:7px; height:7px; border-radius:50%; background:#F59E0B; animation:pulse 1.4s infinite ease-in-out; }
        @keyframes pulse { 0%, 100% { opacity:0.4; transform:scale(0.9); } 50% { opacity:1; transform:scale(1.15); } }
    </style>
</head>
<body>
    <div class="loader" role="status" aria-live="polite">
        <div class="crest">
            <svg width="38" height="38" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M14 15C14 13.343 15.343 12 17 12H21.5C23.157 12 24.5 13.343 24.5 15V34.5C24.5 39.2 27.8 42.4 32 42.4L28.5 51.4C20.1 49.8 14 43.1 14 34.5V15Z" fill="#FFFFFF"/>
                <path d="M50 15C50 13.343 48.657 12 47 12H42.5C40.843 12 39.5 13.343 39.5 15V34.5C39.5 39.2 36.2 42.4 32 42.4C31.2 42.4 30.45 42.28 29.75 42.08L26.8 51.1C28.45 51.68 30.2 52 32 52C41.94 52 50 44.16 50 34.5V15Z" fill="#F59E0B"/>
                <path d="M32 13L37.5 16.2V22.6L32 25.8L26.5 22.6V16.2L32 13Z" fill="#FEF08A"/>
            </svg>
        </div>
        <h1>USTANOMI</h1>
        <p id="boot-status">Güvenli Havuz &amp; Doğrulanmış Usta Ağı hazırlanıyor...</p>
        <div class="pill">
            <span class="dot"></span>
            <span id="queue-badge">Aşamalı Ödeme Koruması (%30 / %40 / %30)</span>
        </div>
    </div>
    <script type="module">
        import { getOfflineQueue, initUstanomiNativeShell } from './capacitor-bridge.js';

        const statusEl = document.getElementById('boot-status');
        const badgeEl = document.getElementById('queue-badge');

        initUstanomiNativeShell({
            onNetworkChange(status) {
                if (!status.connected && statusEl) {
                    statusEl.textContent = 'Çevrimdışı saha modu etkinleştiriliyor...';
                    window.location.replace('offline.html');
                }
            }
        });

        getOfflineQueue().then((items) => {
            if (items.length > 0 && badgeEl) {
                badgeEl.textContent = `${items.length} bekleyen saha kaydı senkronize edilecek`;
            }
        }).catch(() => {});
    </script>
</body>
</html>
